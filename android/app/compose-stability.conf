// Types the Compose compiler should treat as stable.
//
// Every state holder in this app is an immutable data class whose only "unstable"
// member is a read-only collection: `RuntimeState.messages`,
// `RuntimeState.cleanupPreview`, `MessagePage.items` and friends. Without this
// file the compiler treats `List` as an unstable interface, which makes every
// screen that receives `RuntimeState` recompose on each heartbeat even when the
// list instance is unchanged.
//
// The guarantee this file asserts is checked by the code itself: the project does
// not mutate a list after publishing it — every state update builds a new one.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection
kotlin.collections.Iterable
