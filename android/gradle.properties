# Release shrinker uses a 4 GiB heap; override org.gradle.jvmargs on smaller hosts.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# MIUIX 0.9.4 uses Kotlin 2.4 metadata; use the matching standalone compiler.
android.builtInKotlin=false
android.newDsl=false
