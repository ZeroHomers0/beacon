name: Build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check and build server
        working-directory: server
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          go build ./...
      - name: Static analysis
        # Pinned via `go run` instead of an action so the analyzer version is reviewable here and
        # the job needs no third-party action SHA. go vet covers correctness; staticcheck adds the
        # simplifications and dead-code checks vet deliberately leaves out.
        working-directory: server
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Build Linux binaries
        working-directory: server
        run: |
          mkdir -p ../dist/server
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o ../dist/server/beacon-server-linux-$arch ./cmd/beacon
          done
          cp docker-compose.yaml ../dist/server/
          cd ../dist/server
          sha256sum beacon-server-linux-* docker-compose.yaml > SHA256SUMS-server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beacon-server-${{ github.sha }}
          path: dist/server/
          if-no-files-found: error
          retention-days: 30
  android-checks:
    # Unit tests and lint are source-level checks: one run covers all three APKs. Hanging them
    # off a matrix entry made the armeabi-v7a and arm64-v8a builds depend on the universal
    # build's schedule, so a check could silently disappear with a matrix edit.
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/build.gradle.kts
            android/app/build.gradle.kts
            android/settings.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run unit tests and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug
      - name: Upload lint report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report-${{ github.sha }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [android-checks]
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, universal]
    env:
      BEACON_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/build.gradle.kts
            android/app/build.gradle.kts
            android/settings.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Provide a debug signing identity
        # A fresh runner has no debug keystore; nothing here is a release secret.
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Restore optional production signing identity
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.BEACON_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.BEACON_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.BEACON_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.BEACON_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64$RELEASE_KEY_ALIAS$RELEASE_STORE_PASSWORD$RELEASE_KEY_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo 'Production signing is required for a tagged release.' >&2
              exit 1
            fi
            exit 0
          fi
          test -n "$RELEASE_KEYSTORE_BASE64" && test -n "$RELEASE_KEY_ALIAS" && test -n "$RELEASE_STORE_PASSWORD" && test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/beacon-release.jks"
          chmod 600 "$RUNNER_TEMP/beacon-release.jks"
          echo "BEACON_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/beacon-release.jks" >> "$GITHUB_ENV"
      - name: Build the release APK
        working-directory: android
        env:
          BEACON_RELEASE_KEY_ALIAS: ${{ secrets.BEACON_RELEASE_KEY_ALIAS }}
          BEACON_RELEASE_STORE_PASSWORD: ${{ secrets.BEACON_RELEASE_STORE_PASSWORD }}
          BEACON_RELEASE_KEY_PASSWORD: ${{ secrets.BEACON_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PbeaconAbi="$BEACON_ABI" :app:assembleRelease
      - name: Collect the release APK
        run: |
          mkdir -p dist/android
          suffix="-$BEACON_ABI"
          sums="SHA256SUMS-android-$BEACON_ABI"
          if [ "$BEACON_ABI" = universal ]; then
            suffix=""
            sums="SHA256SUMS-android"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/android/beacon-release$suffix.apk"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/android/beacon-release$suffix-unsigned.apk"
          fi
          cd dist/android
          sha256sum *.apk > "$sums"
      - name: Verify APK architecture
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          abi = os.environ["BEACON_ABI"]
          expected = {"armeabi-v7a", "arm64-v8a", "x86", "x86_64"} if abi == "universal" else {abi}
          apk, = Path("dist/android").glob("*.apk")
          with ZipFile(apk) as archive:
              actual = {name.split("/")[1] for name in archive.namelist() if name.startswith("lib/") and name.endswith(".so")}
          assert actual == expected, f"{apk.name}: expected {expected}, got {actual}"
          print(f"{apk.name}: verified {', '.join(sorted(actual))}")
          PY
      - id: android_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beacon-android-${{ matrix.abi }}-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
      - name: Notify Beacon when ARM64 APK is available
        if: ${{ success() && matrix.abi == 'arm64-v8a' }}
        continue-on-error: true
        env:
          BEACON_PUSH_TOKEN: ${{ secrets.BEACON_PUSH_TOKEN }}
          BEACON_ARTIFACT_URL: ${{ steps.android_artifact.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          token = os.environ.get("BEACON_PUSH_TOKEN", "")
          if not token:
              print("Beacon notification skipped: secret is not configured.")
              sys.exit(0)

          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          artifact_url = os.environ.get("BEACON_ARTIFACT_URL") or run_url
          commit = os.environ["GITHUB_SHA"][:7]
          payload = {
              "title": "Beacon ARM64 打包完成",
              "body": f"**arm64-v8a APK 已打包并上传**\n\n版本：{os.environ['GITHUB_REF_NAME']}\n提交：{commit}\n[下载构建产物]({artifact_url})",
              "priority": 5,
              "group": "CI 构建",
              "actions": [{"title": "下载应用", "url": artifact_url}],
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          request = urllib.request.Request(
              "https://push.gzautobot.top/api/v1/push",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "User-Agent": "Beacon-CI/1.0"},
              method="POST",
          )
          try:
              with opener.open(request, timeout=15) as response:
                  if not 200 <= response.status < 300:
                      raise RuntimeError("Unexpected response status")
              print("Beacon build notification queued.")
          except urllib.error.HTTPError as error:
              print(f"::warning title=Beacon notification failed::Push API returned HTTP {error.code}; build artifacts remain available.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"\\n### Beacon notification\\nFailed: HTTP {error.code}. The ARM64 APK is still available.\\n")
              sys.exit(1)
          except Exception:
              print("::warning title=Beacon notification failed::Network or response failure; build artifacts remain available.")
              sys.exit(1)
          PY
  image:
    needs: [server, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Pull BuildKit with bounded registry retries
        run: |
          for attempt in 1 2 3; do
            if timeout 180s docker pull moby/buildkit:buildx-stable-1; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: publish
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record deployment image
        run: |
          echo '### Server image' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.IMAGE }}@${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, android, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish tagged artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'beacon-*' --dir dist
          shopt -s dotglob
          gh release create "$GITHUB_REF_NAME" dist/*/* --verify-tag \
            --title "Beacon $GITHUB_REF_NAME" \
            --generate-notes
